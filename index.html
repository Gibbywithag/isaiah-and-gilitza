<style>
  /* Their day's colors: espresso satin sashes, cream chiavari chairs, the
     emerald garland on the arch, the gold chandelier in the trees.
     Layout: invitation name block, then the day in justified rows by clock time. */
  :root{
    --ink:#1B1511; --ink-deep:#0C0806; --ink-raised:#261D18; --veil:#3A2E26;
    --bone:#F0E9E0; --mute:#A2958A; --gild:#C9A961; --gild-dim:#8A7340; --leaf:#5C8257;

    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,"Helvetica Neue",Arial,sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ink); color:var(--bone); font-family:var(--sans);
       font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));
       padding-right:max(16px,env(safe-area-inset-right,0px))}
  img{display:block; max-width:100%}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  a{color:inherit}
  [hidden]{display:none !important}
  :focus-visible{outline:2px solid var(--gild); outline-offset:3px; border-radius:2px}
  body::before{content:""; position:fixed; inset:0 0 auto;
               height:env(safe-area-inset-top,0px); z-index:30; background:var(--ink)}

  .hero{text-align:center; padding-block:clamp(44px,10vw,100px) clamp(22px,5vw,40px)}
  .names{font-family:var(--serif); font-weight:400; margin:0;
         font-size:clamp(36px,8.5vw,84px); line-height:1.05; letter-spacing:.02em}
  .names .nm{display:block}
  .amp{display:block; font-style:italic; color:var(--gild);
       font-size:clamp(56px,15vw,146px); line-height:.82;
       margin:clamp(2px,1vw,10px) 0 clamp(4px,1.2vw,14px)}
  .dateline{font-family:var(--serif); font-style:italic; color:var(--mute);
            font-size:clamp(15px,2.2vw,20px); margin:clamp(16px,3vw,28px) 0 0}
  .countline{color:var(--mute); font-size:13.5px; margin:9px 0 0}
  .cover{margin:clamp(28px,6vw,52px) auto 0; max-width:1000px}
  .cover img{width:100%; max-height:74vh; object-fit:contain; margin:0 auto; cursor:zoom-in}

  /* The one orchestrated moment: the invitation sets itself, line by line.
     Opacity lives only in the keyframes, so with animations off (reduced
     motion, or no CSS animation support) everything is simply visible. */
  @keyframes riseIn{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none}}
  @keyframes ampIn{from{opacity:0; transform:scale(.72) rotate(-7deg)}
                   to{opacity:1; transform:none}}
  @keyframes ampFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
  @keyframes ampSheen{0%,100%{background-position:0% 50%} 50%{background-position:100% 50%}}
  @keyframes coverIn{from{opacity:0; transform:scale(1.035)} to{opacity:1; transform:none}}
  .names .nm:first-of-type{animation:riseIn .9s cubic-bezier(.2,.7,.2,1) both}
  .amp{animation:ampIn 1.05s .16s cubic-bezier(.2,.9,.25,1) both,
                 ampFloat 7s 1.3s ease-in-out infinite}
  .names .nm:last-of-type{animation:riseIn .9s .3s cubic-bezier(.2,.7,.2,1) both}
  .dateline{animation:riseIn .8s .52s ease-out both}
  .countline{animation:riseIn .8s .62s ease-out both}
  .cover img{animation:coverIn 1.1s .72s cubic-bezier(.2,.7,.2,1) both}
  /* Candlelight moving across the gold. Only where text can be clipped to a
     gradient, otherwise the ampersand stays solid gold. */
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .amp{background:linear-gradient(100deg,var(--gild-dim) 18%,#F3DCA6 42%,
                   var(--gild) 58%,var(--gild-dim) 82%);
         background-size:260% 100%;
         -webkit-background-clip:text; background-clip:text;
         -webkit-text-fill-color:transparent;
         animation:ampIn 1.05s .16s cubic-bezier(.2,.9,.25,1) both,
                   ampFloat 7s 1.3s ease-in-out infinite,
                   ampSheen 7s 1.3s ease-in-out infinite}
  }

  /* Section headings arrive as you reach them. The class is added by script,
     so without script every heading is already in its resting, visible state. */
  .reveal{opacity:0; transform:translateY(16px)}
  .reveal.in{opacity:1; transform:none;
             transition:opacity .65s ease, transform .65s cubic-bezier(.2,.7,.2,1)}

  .bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
       background:rgba(27,21,17,.95); backdrop-filter:blur(12px);
       border-bottom:1px solid var(--veil); margin-top:clamp(34px,7vw,68px)}
  .bar-inner{display:flex; align-items:center; gap:4px; overflow-x:auto;
             height:54px; scrollbar-width:none}
  .bar-inner::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; padding:9px 14px; border-radius:999px; color:var(--mute);
        font-size:14px; white-space:nowrap; transition:color .15s,background .15s}
  .chip:hover{color:var(--bone)}
  .chip[aria-pressed="true"]{background:var(--ink-raised); color:var(--bone)}
  .chip .n{color:var(--mute); margin-left:6px; font-size:12px; font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"] .n{color:var(--gild)}
  .chip-fav[aria-pressed="true"]{color:var(--gild)}
  .bar-sp{flex:1 1 auto; min-width:8px}
  .bar-act{flex:0 0 auto; color:var(--mute); font-size:13.5px; padding:9px 11px;
           display:inline-flex; align-items:center; gap:6px}
  .bar-act:hover{color:var(--bone)}
  .bar-act svg{width:15px; height:15px}

  main{padding-bottom:72px}
  .sec{margin-top:clamp(34px,6vw,60px)}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px;
            padding-bottom:12px; margin-bottom:16px; flex-wrap:wrap;
            border-bottom:1px solid var(--leaf)}
  .sec-title{font-family:var(--serif); font-weight:400; margin:0;
             font-size:clamp(23px,3.4vw,33px); text-wrap:balance}
  .sec-time{color:var(--mute); font-size:13px; font-variant-numeric:tabular-nums}
  .grid{position:relative; width:100%}
  .tile{position:absolute; overflow:hidden; background:var(--ink-raised); cursor:zoom-in; padding:0}
  .tile img{width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.045);
            transition:opacity .55s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
  .tile img.on{opacity:1; transform:none}
  .tile:hover img,.tile:focus-visible img{filter:brightness(1.08)}
  .heart{position:absolute; top:5px; right:5px; width:36px; height:36px;
         display:grid; place-items:center; border-radius:999px; color:rgba(255,255,255,.9);
         opacity:0; background:rgba(12,8,6,.45); transition:opacity .15s,color .15s}
  .tile:hover .heart,.tile:focus-within .heart{opacity:1}
  .heart[aria-pressed="true"]{opacity:1; color:var(--gild)}
  .heart svg{width:17px; height:17px}
  /* Touch screens have no hover, so these would never appear. */
  @media (hover:none){ .heart{opacity:.85} }
  .vbadge{position:absolute; left:7px; bottom:7px; display:inline-flex; align-items:center;
          gap:5px; padding:4px 9px 4px 7px; border-radius:999px; background:rgba(12,8,6,.66);
          color:#fff; font-size:11.5px; font-variant-numeric:tabular-nums; pointer-events:none}
  .vbadge svg{width:11px; height:11px}
  .empty{text-align:center; color:var(--mute); padding:72px 24px;
         font-family:var(--serif); font-style:italic; font-size:19px}

  .lb{position:fixed; inset:0; z-index:100; background:var(--ink-deep); display:none}
  .lb.open{display:block; animation:lbIn .28s ease-out both}
  @keyframes lbIn{from{opacity:0} to{opacity:1}}
  .lb.open .lb-stage img.on{animation:stageIn .4s cubic-bezier(.2,.7,.2,1) both}
  @keyframes stageIn{from{opacity:0; transform:translate(-50%,-50%) scale(.975)}
                     to{opacity:1; transform:translate(-50%,-50%) scale(1)}}
  .lb-stage{position:absolute; inset:0; overflow:hidden; touch-action:none}
  .lb-stage img{position:absolute; top:50%; left:50%; max-width:100%; max-height:100%;
                width:auto; height:auto; transform:translate(-50%,-50%);
                transform-origin:center center; opacity:0; transition:opacity .22s ease;
                will-change:transform}
  .lb-stage img.on{opacity:1}
  .lb-stage video{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
                  max-width:100%; max-height:100%; width:auto; height:auto; background:#000}
  .lb-stage.zoomed{cursor:grab}
  .lb-stage.zoomed img{transition:none}
  .lb-stage.panning{cursor:grabbing}
  .lb-chrome{transition:opacity .25s ease}
  .lb.bare .lb-chrome{opacity:0; pointer-events:none}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); z-index:3;
          width:52px; height:52px; display:grid; place-items:center; border-radius:999px;
          background:rgba(12,8,6,.5); color:rgba(255,255,255,.78);
          transition:color .15s,background .15s,opacity .25s}
  .lb-nav:hover{color:#fff; background:rgba(12,8,6,.78)}
  .lb-prev{left:max(12px,env(safe-area-inset-left,0px))}
  .lb-next{right:max(12px,env(safe-area-inset-right,0px))}
  .lb-nav svg{width:24px; height:24px}
  .lb-nav[disabled]{opacity:.2}
  .lb-top{position:absolute; z-index:4; left:0; right:0; top:env(safe-area-inset-top,0px);
          display:flex; align-items:center; justify-content:space-between; gap:12px;
          padding:12px max(14px,env(safe-area-inset-right,0px)) 26px max(14px,env(safe-area-inset-left,0px));
          background:linear-gradient(rgba(12,8,6,.72),transparent)}
  .lb-count{color:rgba(255,255,255,.72); font-size:13px; font-variant-numeric:tabular-nums}
  .lb-icons{display:flex; gap:6px}
  .lb-ico{width:40px; height:40px; display:grid; place-items:center; border-radius:999px;
          color:rgba(255,255,255,.76); background:rgba(12,8,6,.4);
          transition:color .15s,background .15s}
  .lb-ico:hover{color:#fff; background:rgba(12,8,6,.72)}
  .lb-ico.on{color:var(--gild)}
  .lb-ico svg{width:19px; height:19px}
  .lb-bottom{position:absolute; z-index:4; left:0; right:0; bottom:0;
             display:flex; align-items:center; gap:14px; flex-wrap:wrap;
             padding:30px max(16px,env(safe-area-inset-right,0px))
                     calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
             background:linear-gradient(transparent,rgba(12,8,6,.82))}
  .lb-meta{min-width:0; flex:1 1 180px}
  .lb-when{font-family:var(--serif); font-size:18px; font-variant-numeric:tabular-nums}
  .lb-sub{color:rgba(255,255,255,.5); font-size:12px; margin-top:2px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lb-btn{display:inline-flex; align-items:center; gap:8px; padding:10px 15px;
          border:1px solid rgba(255,255,255,.22); border-radius:999px;
          color:rgba(255,255,255,.82); font-size:13.5px; text-decoration:none;
          transition:color .15s,border-color .15s}
  .lb-btn:hover{color:#fff; border-color:rgba(255,255,255,.45)}
  .lb-btn svg{width:15px; height:15px}
  .lb-btn.is-fav{color:var(--gild); border-color:var(--gild-dim)}
  .lb-dl{background:rgba(201,169,97,.14); border-color:var(--gild-dim); color:#EBD9AC}
  .lb-dl:hover{background:rgba(201,169,97,.26); color:#fff; border-color:var(--gild)}
  .bar-act.bar-dl{color:var(--gild)}
  .bar-act.bar-dl:hover{color:#EBD9AC}
  .lb-prog{position:absolute; top:0; left:0; height:2px; width:0; z-index:5; background:var(--gild)}
  .lb-prog.run{transition:width linear}

  .sheet{position:fixed; inset:0; z-index:120; background:rgba(12,8,6,.78);
         display:none; place-items:center; padding:20px}
  .sheet.open{display:grid}
  .sheet-card{background:var(--ink-raised); border:1px solid var(--veil); border-radius:4px;

  .sheet-card h2{font-family:var(--serif); font-weight:400; font-size:25px; margin:0 0 6px}
  .sheet-card p{color:var(--mute); margin:0 0 16px; font-size:14px; line-height:1.65}
  .sheet-card dl{margin:0 0 18px; display:grid; grid-template-columns:auto 1fr; gap:10px 16px}
  .sheet-card dt{color:var(--gild); font-size:12.5px; white-space:nowrap; padding-top:1px}
  .sheet-card dd{margin:0; color:var(--mute); font-size:13.5px}
  .sheet-card textarea{width:100%; height:170px; background:var(--ink); color:var(--bone);
    border:1px solid var(--veil); border-radius:3px; padding:12px;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical}
  .sheet-acts{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .btn{padding:10px 17px; border:1px solid var(--veil); border-radius:999px;
       color:var(--bone); font-size:13.5px}
  .btn:hover{border-color:#54443A}
  .btn-key{background:var(--gild); color:#1B1511; border-color:var(--gild); font-weight:500}
  .btn-key:hover{background:#D8B974; border-color:#D8B974}

  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px));
         transform:translateX(-50%) translateY(12px); background:var(--bone); color:var(--ink);
         padding:11px 19px; border-radius:999px; font-size:13.5px; z-index:200;
         opacity:0; pointer-events:none; transition:opacity .2s,transform .2s}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  footer{border-top:1px solid var(--veil); padding-block:26px 40px;
         color:#7A6B60; font-size:12.5px; text-align:center}
  footer .amp-sm{color:var(--gild-dim); font-family:var(--serif); font-style:italic}

  @media (max-width:640px){ .sheet-card{padding:20px} .lb-nav{width:46px; height:46px} .lb-bottom{gap:10px} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;
                         animation-duration:.01ms !important;
                         animation-iteration-count:1 !important;
                         scroll-behavior:auto !important}
    .reveal{opacity:1; transform:none}
  }
</style>

<script>
(function(){
  "use strict";
  var LOG="[gallery]", W=window.WEDDING, $=function(i){return document.getElementById(i)};
  var P=window.GALLERY_PATHS;                      // {t,w,v,orig} injected per build
  if(!W||!W.sections||!W.sections.length){
    console.error(LOG,"photo list missing or empty — nothing to render");
    $("gallery").innerHTML='<p class="empty">The photo list did not load.</p>'; return;
  }
  console.log(LOG,"loaded",W.total,"items ("+(W.videos||0)+" videos) across",W.sections.length,"sections");

  var FAV_KEY="ig-wedding-favorites-v1", ALL=[];
  W.sections.forEach(function(sec,si){
    sec.photos.forEach(function(p){
      ALL.push({file:p.f,v:p.v||null,dur:p.d||0,orig:p.o||p.f,w:p.w,h:p.h,time:p.t,
                sec:sec.name,dir:p.p||sec.dir,si:si,id:(p.p||sec.dir)+"/"+p.f,
                gi:ALL.length,                 // position in the packed index
                aspect:(p.w&&p.h)?p.w/p.h:1.5});
    });
  });

  /* An artifact may hold at most 512 files and this gallery has far more
     images, so when published they travel as a handful of binary packs and
     are sliced back out here. On disk, beside the originals, they are
     ordinary files and none of this runs. */
  var PACK=window.PACKINDEX||null;
  var packBuf={}, packOrder=[], objURL={}, urlOrder=[];
  var MAX_W_PACKS=20, MAX_W_URLS=48;
  function pad3(n){ n=String(n); while(n.length<3) n="0"+n; return n; }
  function loadPack(kind,n){
    var key=kind+n, url="p/"+kind+pad3(n)+".jpg";   // concatenated JPEGs; .bin is not a served type
    if(!packBuf[key]){
      packBuf[key]=fetch(url).then(function(r){
        if(!r.ok) throw new Error(url+" -> HTTP "+r.status);
        return r.arrayBuffer();
      }).catch(function(e){ delete packBuf[key]; throw e; });
      if(kind==="w"){
        packOrder.push(key);
        while(packOrder.length>MAX_W_PACKS) delete packBuf[packOrder.shift()];
      }
    }
    return packBuf[key];
  }
  function packedURL(kind,gi){
    var key=kind+gi;
    if(objURL[key]) return Promise.resolve(objURL[key]);
    var e=PACK&&PACK[kind]&&PACK[kind][gi];
    if(!e) return Promise.reject(new Error("no pack entry for "+key));
    return loadPack(kind,e[0]).then(function(buf){
      if(objURL[key]) return objURL[key];
      var u=URL.createObjectURL(new Blob([new Uint8Array(buf,e[1],e[2])],{type:"image/jpeg"}));
      objURL[key]=u;
      if(kind==="w"){
        urlOrder.push(key);
        while(urlOrder.length>MAX_W_URLS){
          var old=urlOrder.shift();
          if(objURL[old]){ URL.revokeObjectURL(objURL[old]); delete objURL[old]; }
        }
      }
      return u;
    });
  }
  function enc(p){return p.split("/").map(encodeURIComponent).join("/")}
  function thumbURL(it){return enc(P.t+it.dir+"/"+it.file)}
  function webURL(it){return enc(P.w+it.dir+"/"+it.file)}
  function videoURL(it){return enc(P.v+it.dir+"/"+it.v)}
  function origURL(it){
    // On the public site the originals are flat release assets, not folders.
    return P.flatOrig ? P.orig+encodeURIComponent(it.orig)
                      : enc(P.orig+it.dir+"/"+it.orig);
  }
  function isVid(it){return !!it.v}
  function fmtDur(s){ s=Math.round(s||0); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2) }

  /* ---- favorites (per device) ---- */
  var favs=new Set();
  try{
    var raw=localStorage.getItem(FAV_KEY);
    if(raw) JSON.parse(raw).forEach(function(id){favs.add(id)});
    console.log(LOG,"restored",favs.size,"favorites");
  }catch(e){ console.warn(LOG,"could not read saved favorites:",e.message,"— starting empty"); }
  function saveFavs(){
    try{ localStorage.setItem(FAV_KEY,JSON.stringify(Array.from(favs))); }
    catch(e){ console.error(LOG,"could not save favorites ("+favs.size+" items):",e.message);
              toast("This browser would not save favorites."); }
  }
  function isFav(it){return favs.has(it.id)}
  function toggleFav(it){ favs.has(it.id)?favs.delete(it.id):favs.add(it.id); saveFavs(); syncFav(it); }
  function syncFav(it){
    var on=isFav(it);
    document.querySelectorAll('.heart[data-id="'+it.id.replace(/["\\]/g,"\\$&")+'"]').forEach(function(h){
      h.setAttribute("aria-pressed",on?"true":"false");
      h.setAttribute("aria-label",(on?"Remove ":"Mark ")+it.orig+(on?" from favorites":" as a favorite"));
    });
    var c=$("chipFav"); if(c) c.querySelector(".n").textContent=favs.size;
    if(view==="fav"&&!on) renderView();
    if(lbOpen&&seq[cur]&&seq[cur].id===it.id) paintFav();
  }
  var toastT=null;
  function toast(m){ var el=$("toast"); el.textContent=m; el.classList.add("on");
    clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("on")},2400); }

  /* ---- hero ---- */
  $("dateline").textContent=W.dateLong||"";
  var cl=W.total+" photographs and films, from "+(W.dayStart||"")+" to "+(W.dayEnd||"");

  $("countline").textContent=cl;
  var cover=ALL.filter(function(i){return i.file==="_PMD7698.jpg"})[0]||ALL[Math.floor(ALL.length*0.55)];
  if(cover){
    var ci=$("coverImg");
    ci.onerror=function(){console.error(LOG,"cover image failed"); ci.style.display="none"};
    if(P.packed){
      packedURL("w",cover.gi).then(function(u){ci.src=u})
        .catch(function(e){console.error(LOG,"cover pack failed:",e.message); ci.style.display="none"});
    } else ci.src=webURL(cover);
    ci.addEventListener("click",function(){setView("all"); openLb(cover)});
  }

  /* ---- chips ---- */
  var view="all", chipsEl=$("chips");
  function chip(label,count,key,cls,id){
    var b=document.createElement("button");

    b.setAttribute("aria-pressed",view===key?"true":"false"); b.dataset.key=key;

    b.firstChild.textContent=label; b.lastChild.textContent=count;
    b.addEventListener("click",function(){setView(key)});
    chipsEl.appendChild(b);
  }
  chip("All",W.total,"all");
  W.sections.forEach(function(s,i){chip(s.name,s.photos.length,"s"+i)});
  if(W.videos) chip("Films",W.videos,"vid");

  var sp=document.createElement("span"); sp.className="bar-sp"; chipsEl.appendChild(sp);

    chipsEl.appendChild(dl);
  }
  var hb=document.createElement("button"); hb.className="bar-act"; hb.type="button";
  hb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Help</span>';
  hb.addEventListener("click",openHelp); chipsEl.appendChild(hb);
  function setView(k){
    view=k;
    chipsEl.querySelectorAll(".chip").forEach(function(c){
      c.setAttribute("aria-pressed",c.dataset.key===k?"true":"false")});
    renderView();
  }

  /* ---- grid ---- */
  var galleryEl=$("gallery"), groups=[];
  function tileFor(it){
    var b=document.createElement("button"); b.className="tile"; b.type="button";
    b.setAttribute("aria-label",(isVid(it)?"Play film from ":"Open photograph from ")+it.time);
    var img=document.createElement("img");
    img.decoding="async"; img.alt=it.sec+", "+it.time;
    img.addEventListener("load",function(){img.classList.add("on")});
    img.addEventListener("error",function(){
      console.error(LOG,"thumbnail failed for",it.id); b.style.background="#3A2E26"});
    if(P.packed){

      // pull every thumbnail at once.
      b.dataset.gi=it.gi;
      tileQueue(b,img,it);

      img.loading="lazy";
      img.src=thumbURL(it);
    }
    b.appendChild(img);
    if(isVid(it)){
      var vb=document.createElement("span"); vb.className="vbadge";
      vb.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';

    var h=document.createElement("span");
    h.className="heart"; h.dataset.id=it.id;
    h.setAttribute("role","button"); h.setAttribute("tabindex","0");
    h.setAttribute("aria-pressed",isFav(it)?"true":"false");
    h.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20s-7-4.4-7-9.3A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.7C19 15.6 12 20 12 20z"/></svg>';
    function hit(e){e.stopPropagation(); e.preventDefault(); toggleFav(it)}
    h.addEventListener("click",hit);
    h.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")hit(e)});
    b.appendChild(h);
    b.addEventListener("click",function(){openLb(it)});
    return b;
  }
  var tileObs=null;
  function tileQueue(b,img,it){
    if(!("IntersectionObserver" in window)){
      packedURL("t",it.gi).then(function(u){img.src=u})
        .catch(function(e){console.error(LOG,"thumb pack failed:",e.message)});
      return;
    }
    if(!tileObs){
      tileObs=new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(!en.isIntersecting) return;
          var el=en.target; tileObs.unobserve(el);
          var r=el._load; if(r) r();
        });
      },{rootMargin:"600px 0px"});
    }
    b._load=function(){
      packedURL("t",it.gi).then(function(u){img.src=u})
        .catch(function(e){ console.error(LOG,"thumb pack failed:",e.message);
                            b.style.background="#3A2E26"; });
    };
    tileObs.observe(b);
  }

  function renderView(){
    if(tileObs){ tileObs.disconnect(); tileObs=null; }
    galleryEl.innerHTML=""; groups=[];
    var sets;
    if(view==="fav"||view==="vid"){
      var list=view==="fav"?ALL.filter(isFav):ALL.filter(isVid);
      if(!list.length){
        galleryEl.innerHTML='<p class="empty">'+(view==="fav"
          ?"No favorites yet. Tap the heart on anything and it will gather here."
          :"No films yet.")+'</p>'; return;
      }
      sets=[{title:view==="fav"?"Favorites":"Films",
             time:list.length+(view==="fav"?" of "+W.total:""),items:list}];
    } else if(view==="all"){
      sets=W.sections.map(function(s,i){
        return {title:s.name,time:s.start+" – "+s.end,
                items:ALL.filter(function(it){return it.si===i})}});
    } else {
      var idx=parseInt(view.slice(1),10), s=W.sections[idx];
      if(!s){console.error(LOG,"unknown view",view); view="all"; return renderView()}
      sets=[{title:s.name,time:s.start+" – "+s.end,
             items:ALL.filter(function(it){return it.si===idx})}];
    }
    sets.forEach(function(set){
      var sec=document.createElement("section"); sec.className="sec";
      var head=document.createElement("div"); head.className="sec-head";
      var h2=document.createElement("h2"); h2.className="sec-title"; h2.textContent=set.title;
      var tm=document.createElement("span"); tm.className="sec-time"; tm.textContent=set.time;
      head.appendChild(h2); head.appendChild(tm); sec.appendChild(head);
      var g=document.createElement("div"); g.className="grid";
      set.items.forEach(function(it){g.appendChild(tileFor(it))});
      sec.appendChild(g); galleryEl.appendChild(sec);
      groups.push({grid:g,items:set.items});
    });
    relayout(true);
    armReveals();
  }

  /* Headings fade up as they are reached. Applied only from script and only
     when motion is welcome, so the page is always complete at rest; a
     fallback reveals everything in case the observer never fires. */
  var REDUCED = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var revealObs=null;
  function armReveals(){
    var heads=galleryEl.querySelectorAll(".sec-head");
    if(REDUCED||!("IntersectionObserver" in window)){
      heads.forEach(function(h){h.classList.remove("reveal")});
      return;
    }
    if(!revealObs){
      revealObs=new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){ e.target.classList.add("in"); revealObs.unobserve(e.target); }
        });
      },{rootMargin:"0px 0px -8% 0px"});
    }
    heads.forEach(function(h){
      h.classList.add("reveal");
      revealObs.observe(h);
      // first heading is already on screen; do not make the reader wait
      if(h.getBoundingClientRect().top < window.innerHeight) h.classList.add("in");
    });
    clearTimeout(armReveals._t);
    armReveals._t=setTimeout(sweepReveals,1200);
    if(!armReveals._scroll){
      // Insurance: in an undersized frame the observer can stay quiet, and a
      // heading that never appears is far worse than a missed animation.
      armReveals._scroll=true;
      window.addEventListener("scroll",function(){
        clearTimeout(armReveals._s);
        armReveals._s=setTimeout(sweepReveals,120);
      },{passive:true});
    }
  }
  function sweepReveals(){
    var left=galleryEl.querySelectorAll(".sec-head.reveal:not(.in)");
    left.forEach(function(h){
      if(h.getBoundingClientRect().top < window.innerHeight*1.3) h.classList.add("in");
    });
  }
  /* Justified rows — everything keeps its true shape, nothing centre-cropped. */
  function layout(){
    groups.forEach(function(gr){
      var W0=gr.grid.clientWidth; if(!W0) return;
      var gap=W0<640?5:9, target=W0<640?200:(W0<1100?270:340);
      var tiles=gr.grid.children, row=[], rowAspect=0, top=0;
      function flush(isLast){
        if(!row.length) return;
        var h=(W0-gap*(row.length-1))/rowAspect;
        if(isLast&&h>target*1.4) h=target;
        var x=0;
        row.forEach(function(e){
          var w=e.aspect*h;
          e.el.style.left=x+"px"; e.el.style.top=top+"px";
          e.el.style.width=w+"px"; e.el.style.height=h+"px"; x+=w+gap;
        });
        top+=h+gap; row=[]; rowAspect=0;
      }
      for(var i=0;i<gr.items.length;i++){
        var el=tiles[i]; if(!el) continue;
        row.push({el:el,aspect:gr.items[i].aspect}); rowAspect+=gr.items[i].aspect;
        if((W0-gap*(row.length-1))/rowAspect<=target) flush(false);
      }
      flush(true);
      gr.grid.style.height=Math.max(0,top-gap)+"px";
    });
  }
  /* A page can be laid out while its viewport is still zero-wide (a hidden tab,
     an iframe that has not been sized yet). layout() can do nothing then, so
     watch for the width actually arriving instead of relying on load order.
     Width only — the grid sets its own height, and reacting to that would loop. */
  var lastW=-1;
  function relayout(force){
    var w=galleryEl.clientWidth;
    if(!force && w===lastW) return;
    lastW=w; layout();
  }
  var rT=null;
  window.addEventListener("resize",function(){clearTimeout(rT); rT=setTimeout(relayout,90)});
  if(window.ResizeObserver){
    try{ new ResizeObserver(function(){relayout()}).observe(galleryEl); }
    catch(e){ console.warn(LOG,"ResizeObserver unavailable:",e.message); }
  }

  /* ---- viewer ---- */
  var lb=$("lb"), lbImg=$("lbImg"), lbVid=$("lbVid"), stage=$("lbStage");
  var seq=[], cur=0, lbOpen=false, lastFocus=null, token=0;
  var zs=1, zx=0, zy=0, play=false, playT=null, chromeT=null;

  function currentSeq(){
    if(view==="fav") return ALL.filter(isFav);
    if(view==="vid") return ALL.filter(isVid);
    if(view==="all") return ALL;
    var i=parseInt(view.slice(1),10);
    return ALL.filter(function(it){return it.si===i});
  }
  function stopVideo(){
    if(!lbVid.hasAttribute("src")&&!lbVid.src) { lbVid.hidden=true; return; }
    try{ lbVid.pause(); }catch(e){ console.warn(LOG,"could not pause video:",e.message); }
    lbVid.removeAttribute("src"); lbVid.removeAttribute("poster");
    try{ lbVid.load(); }catch(e){ console.warn(LOG,"could not reset video:",e.message); }
    lbVid.hidden=true;
  }
  function openLb(it){
    seq=currentSeq();
    cur=seq.findIndex(function(x){return x.id===it.id});
    if(cur<0){ seq=ALL; cur=ALL.findIndex(function(x){return x.id===it.id}); }
    if(cur<0){ console.error(LOG,"cannot locate",it.id); return; }
    lastFocus=document.activeElement; lbOpen=true;
    lb.classList.add("open"); document.body.style.overflow="hidden";
    paint(); wake(); $("lbClose").focus();
  }
  function closeLb(){
    lbOpen=false; stopPlay(); stopVideo(); lb.classList.remove("open");
    document.body.style.overflow="";
    token++; lbImg.onload=lbImg.onerror=null; lbImg.removeAttribute("src");
    lbImg.classList.remove("on"); resetZoom();
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  function go(d){
    var n=cur+d; if(n<0||n>=seq.length){ if(play) stopPlay(); return; }
    cur=n; resetZoom(); paint(); wake();
  }
  function paint(){
    var it=seq[cur]; if(!it) return;
    var my=++token;
    stopVideo();
    $("lbCount").textContent=(cur+1)+" / "+seq.length;
    $("lbWhen").textContent=it.time||"";
    $("lbSub").textContent=it.sec+(isVid(it)?" — film, "+fmtDur(it.dur):"");
    $("lbPrev").disabled=cur===0; $("lbNext").disabled=cur===seq.length-1;
    $("lbZoom").hidden=isVid(it);
    paintFav();
    if(P.hasOrig){
      var sv=$("lbSave"); sv.hidden=false;
      sv.href=(P.flatOrig||!isVid(it))?origURL(it):videoURL(it);
      if(P.downloadAttr) sv.setAttribute("download",it.orig);
      else sv.removeAttribute("download");
      $("lbSaveTxt").textContent=P.downloadAttr
        ? (isVid(it)?"Download the film":"Download full size")
        : (isVid(it)?"Open the original film":"Open full size");
    }

    if(isVid(it)){
      lbImg.classList.remove("on"); lbImg.hidden=true;
      lbVid.hidden=false;
      lbVid.removeAttribute("poster");
      if(P.packed){
        packedURL("w",it.gi).then(function(u){ if(my===token) lbVid.poster=u; })
          .catch(function(e){ console.warn(LOG,"video poster unavailable:",e.message); });
      } else lbVid.poster=webURL(it);
      lbVid.src=videoURL(it);
      lbVid.onerror=function(){
        if(my!==token) return;
        console.error(LOG,"video failed to load:",videoURL(it));
        toast("That film would not load.");
      };
      // Opening came from a tap, so sound is usually allowed; if the browser
      // refuses, the poster and controls are already there.
      var pr=lbVid.play();
      if(pr&&pr.catch) pr.catch(function(err){ console.log(LOG,"autoplay declined:",err.name); });
      return;
    }

    lbVid.hidden=true; lbImg.hidden=false;
    lbImg.classList.remove("on");
    /* Load detached, then swap: changing src mid-flight aborts the old request
       and fires an error indistinguishable from a real failure. */
    function show(url){
      var pre=new Image();
      pre.onload=function(){
        if(my!==token) return;
        lbImg.src=url; lbImg.alt=it.sec+", "+it.time; lbImg.classList.add("on");
        if(play) armPlay();
      };
      pre.onerror=function(){
        if(my!==token) return;
        console.error(LOG,"full view failed to load for",it.id);
        toast("That photo would not load."); if(play) armPlay();
      };
      pre.src=url;
    }
    if(P.packed){
      packedURL("w",it.gi).then(function(u){ if(my===token) show(u); })
        .catch(function(e){
          if(my!==token) return;
          console.error(LOG,"full view pack failed:",e.message);
          toast("That photo would not load."); if(play) armPlay();
        });
    } else show(webURL(it));
    [1,-1,2].forEach(function(d){              // warm the neighbours
      var nx=seq[cur+d]; if(!nx||isVid(nx)) return;
      if(P.packed) packedURL("w",nx.gi).catch(function(){});
      else { var pi=new Image(); pi.src=webURL(nx); }
    });
  }
  function paintFav(){
    var on=isFav(seq[cur]), b=$("lbFav");
    b.classList.toggle("is-fav",on); b.setAttribute("aria-pressed",on?"true":"false");
    $("lbFavTxt").textContent=on?"Favorited":"Favorite";
  }
  function wake(){
    lb.classList.remove("bare"); clearTimeout(chromeT);
    chromeT=setTimeout(function(){
      if(lbOpen&&zs===1&&!isVid(seq[cur])) lb.classList.add("bare");
    },2800);
  }

  /* zoom (photos only) */
  function applyZoom(){
    lbImg.style.transform="translate(calc(-50% + "+zx+"px), calc(-50% + "+zy+"px)) scale("+zs+")";
    stage.classList.toggle("zoomed",zs>1);
    $("lbZoom").classList.toggle("on",zs>1);
    $("lbZoom").setAttribute("aria-label",zs>1?"Zoom out":"Zoom in");
  }
  function resetZoom(){ zs=1; zx=0; zy=0; applyZoom(); }
  function clampPan(){
    var r=lbImg.getBoundingClientRect();
    var ox=Math.max(0,(r.width-stage.clientWidth)/2), oy=Math.max(0,(r.height-stage.clientHeight)/2);
    zx=Math.max(-ox,Math.min(ox,zx)); zy=Math.max(-oy,Math.min(oy,zy));
  }
  function toggleZoom(){
    if(isVid(seq[cur])) return;
    if(zs>1){ resetZoom(); wake(); }
    else { zs=2.5; zx=0; zy=0; applyZoom(); clampPan(); applyZoom();
           lb.classList.remove("bare"); clearTimeout(chromeT); }
  }

  /* slideshow — films run to their end instead of being cut off by the timer */
  var SLIDE_MS=4500;
  function armPlay(){
    clearTimeout(playT);
    var p=$("lbProg");
    if(isVid(seq[cur])){ p.classList.remove("run"); p.style.width="0"; return; }
    p.classList.remove("run"); p.style.width="0"; void p.offsetWidth;
    p.style.transitionDuration=SLIDE_MS+"ms"; p.classList.add("run"); p.style.width="100%";
    playT=setTimeout(function(){
      if(!play) return;
      if(cur>=seq.length-1){ stopPlay(); return; }
      go(1);
    },SLIDE_MS);
  }
  lbVid.addEventListener("ended",function(){
    if(play){ if(cur>=seq.length-1) stopPlay(); else go(1); }
  });
  function startPlay(){
    play=true;
    $("lbPlay").classList.add("on"); $("lbPlay").setAttribute("aria-label","Pause slideshow");
    $("lbPlay").innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
    armPlay();
  }
  function stopPlay(){
    play=false; clearTimeout(playT);
    var p=$("lbProg"); p.classList.remove("run"); p.style.width="0";
    $("lbPlay").classList.remove("on"); $("lbPlay").setAttribute("aria-label","Play slideshow");
    $("lbPlay").innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
  }

  $("lbClose").addEventListener("click",closeLb);
  $("lbPrev").addEventListener("click",function(e){e.stopPropagation(); stopPlay(); go(-1)});
  $("lbNext").addEventListener("click",function(e){e.stopPropagation(); stopPlay(); go(1)});
  $("lbFav").addEventListener("click",function(){toggleFav(seq[cur])});
  $("lbZoom").addEventListener("click",function(e){e.stopPropagation(); stopPlay(); toggleZoom()});
  $("lbPlay").addEventListener("click",function(e){e.stopPropagation(); play?stopPlay():startPlay()});

  /* pointer: tap toggles chrome, double-tap zooms, drag pans. The video keeps
     its own controls, so gestures stay off it. */
  var down=null, moved=false, lastTap=0;
  stage.addEventListener("pointerdown",function(e){
    if(isVid(seq[cur])) return;
    down={x:e.clientX,y:e.clientY,zx:zx,zy:zy}; moved=false;
    if(zs>1){ stage.classList.add("panning"); stage.setPointerCapture(e.pointerId); }
  });
  stage.addEventListener("pointermove",function(e){
    if(!down) return;
    var dx=e.clientX-down.x, dy=e.clientY-down.y;
    if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
    if(zs>1){ zx=down.zx+dx; zy=down.zy+dy; clampPan(); applyZoom(); }
  });
  stage.addEventListener("pointerup",function(e){
    stage.classList.remove("panning");
    if(!down) return;
    var dx=e.clientX-down.x, dy=e.clientY-down.y; down=null;
    if(zs===1&&moved){
      if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)){ stopPlay(); go(dx<0?1:-1); return; }
      if(dy>90&&Math.abs(dy)>Math.abs(dx)){ closeLb(); return; }
    }
    if(!moved){
      var now=Date.now();
      if(now-lastTap<300){ stopPlay(); toggleZoom(); lastTap=0; return; }
      lastTap=now;
      setTimeout(function(){
        if(lastTap&&Date.now()-lastTap>=280){
          if(zs===1) lb.classList.contains("bare")?wake():lb.classList.add("bare");
          lastTap=0;
        }
      },300);
    }
  });
  stage.addEventListener("pointercancel",function(){down=null; stage.classList.remove("panning")});
  lb.addEventListener("mousemove",function(){ if(zs===1) wake(); });

  document.addEventListener("keydown",function(e){
    if($("sheet").classList.contains("open")){ if(e.key==="Escape") closeSheet(); return; }
    if(!lbOpen) return;
    if(e.key==="Escape"){ zs>1?resetZoom():closeLb(); }
    else if(e.key==="ArrowLeft"){ stopPlay(); go(-1); }
    else if(e.key==="ArrowRight"){ stopPlay(); go(1); }
    else if(e.key==="f"||e.key==="F"){ toggleFav(seq[cur]); }
    else if(e.key==="z"||e.key==="Z"){ stopPlay(); toggleZoom(); }
    else if(e.key===" "&&!isVid(seq[cur])){ e.preventDefault(); play?stopPlay():startPlay(); }
  });

  /* ---- sheets ---- */
  function openSheet(t,h){ $("sheetTitle").textContent=t; $("sheetBody").innerHTML=h; $("sheet").classList.add("open"); }
  function closeSheet(){ $("sheet").classList.remove("open"); }
  $("sheet").addEventListener("click",function(e){ if(e.target===$("sheet")) closeSheet(); });
  function openHelp(){
    openSheet("Your day",
      '<p>Everything from the day, in the order it happened.</p><dl>'+
      '<dt>Tap anything</dt><dd>Opens it large. Swipe or use the arrows to move through the day.</dd>'+
      '<dt>Double-tap</dt><dd>Zooms a photograph in. Drag to look around, double-tap again to fit.</dd>'+
      '<dt>Films</dt><dd>Marked with their length. They play with sound, and the slideshow waits for them to finish.</dd>'+
      '<dt>Play</dt><dd>Runs the whole day as a slideshow.</dd>'+
      '<dt>The heart</dt><dd>Marks a favorite, remembered on this device.</dd>'+
      '<dt>'+P.saveLabel+'</dt><dd>'+P.saveHelp+'</dd></dl>'+
      '<div class="sheet-acts">'+
        '<button class="btn btn-key" id="shFav">See my favorites as a list</button>'+
        '<button class="btn" id="shClose">Close</button></div>');
    $("shClose").addEventListener("click",closeSheet);
    $("shFav").addEventListener("click",openFavList);
  }
  function openFavList(){
    var list=ALL.filter(isFav);
    if(!list.length){
      openSheet("Your favorites",
        '<p>Nothing marked yet. Tap the heart on anything and it will appear here.</p>'+
        '<div class="sheet-acts"><button class="btn" id="shClose">Close</button></div>');
      $("shClose").addEventListener("click",closeSheet); return;
    }
    var text=list.map(function(it){return it.sec+"/"+it.orig+"    "+it.time}).join("\n");
    openSheet("Your favorites",
      '<p>'+list.length+' item'+(list.length===1?'':'s')+'. '+P.favHelp+'</p>'+
      '<textarea id="favText" readonly spellcheck="false"></textarea>'+
      '<div class="sheet-acts"><button class="btn btn-key" id="favCopy">Copy the list</button>'+
      '<button class="btn" id="shClose">Close</button></div>');
    $("favText").value=text;
    $("shClose").addEventListener("click",closeSheet);
    $("favCopy").addEventListener("click",function(){copyText(text)});
  }
  function copyText(text){
    function fallback(){
      try{
        var ta=$("favText"); if(ta){ta.focus(); ta.select()}
        var ok=document.execCommand&&document.execCommand("copy");
        toast(ok?"List copied.":"Select the text and copy it.");
      }catch(err){ console.error(LOG,"clipboard fallback failed:",err.message);
                   toast("Select the text and copy it."); }
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast("List copied.")})
        .catch(function(err){console.warn(LOG,"clipboard refused:",err.message); fallback()});
    } else fallback();
  }

  renderView();
  window.addEventListener("load",function(){relayout(true)});
  if(document.fonts&&document.fonts.ready)
    document.fonts.ready.then(function(){relayout(true)}).catch(function(){});
  console.log(LOG,"ready");
})();
</script>
</body>
</html>
